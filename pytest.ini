[pytest]
minversion = 6.0
addopts = -ra -q --strict-markers -m "not slow"
testpaths = tests
markers =
    unit: marks tests as unit tests (fast, isolated)
    integration: marks tests as integration tests (slower, may require setup)
    internal_features: marks tests related to internal features system
    graph_cache: marks tests related to graph cache feature
    workflows: marks tests related to workflows feature
    slow: marks tests as slow (skipped by default, run with '-m ""' or '-m slow')