[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "woodwork-engine"
version = "0.2.12"
description = "An AI Agent IaC tool that aims to make developing and deploying AI Agents easier."
readme = "README.md"
authors = [{ name = "Will Woodward" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "colorama>=0.4.6",
    "deprecated>=1.2.18",
    "distro>=1.9.0",
    "fastapi>=0.115.6",
    "flask-socketio>=5.5.1",
    "idna>=3.10",
    "jsonpointer>=3.0.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "tomli>=2.2.1",
    "uv>=0.7.12",
    "uvicorn>=0.35.0",
    "websockets>=15.0.1",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]
dev = [
    "woodwork-engine[test]",
    "ruff>=0.11.12",
    "black>=24.0.0",
    "pre-commit>=3.0.0",
    "ty==0.0.1a9",
]
all = [
    "woodwork-engine[dev]",
    "chromadb>=1.0.12",
    "langchain>=0.3.25",
    "langchain-chroma>=0.2.4",
    "langchain-community>=0.3.24",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.3.0",
    "sentence-transformers>=4.1.0",
    "docker>=6.1.3",
    "mcp>=1.1.2",
    "neo4j>=5.0.0",
    "tiktoken>=0.8.0",
    "openai>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
woodwork = "woodwork.cli.app:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["woodwork*"]

[tool.setuptools.package-data]
"*" = [
    "requirements/**/*.txt",
    "config/log_config.json",
    "config/.env.example",
    "config/prompts/**/*",
    ]
"woodwork.gui" = ["dist/**/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E722"]

[tool.ty.rules]
unknown-argument = "ignore"
unresolved-import = "ignore"

# NOTE: To check types without test/example noise, run: ty check woodwork/
# Tests and examples have intentional mocking patterns (e.g., obj.method = Mock())
# that cause invalid-assignment warnings. These should be fixed in the future with
# proper mock typing, but for now just exclude tests/ and examples/ when type checking.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
